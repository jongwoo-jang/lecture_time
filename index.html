<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FBDCE9">
<title>강의 현황</title>
<style>
:root{
  --ink:#1A1723;
  --ink-2:#6E6880;
  --ink-3:#9C97AB;
  --accent:#6D4AE0;
  --sheet:#FFFFFF;
  --line:#EFEDF5;
  --tap:44px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--sheet);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
              "Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
.wrap{max-width:520px;margin:0 auto;padding:0 20px}

/* ── 그라데이션 헤더 ───────────────────────────── */
.hero{
  background:linear-gradient(158deg,#FBDCE9 0%,#EFDEF6 38%,#DFE4FA 68%,#D6EAFA 100%);
  padding:calc(16px + env(safe-area-inset-top)) 0 34px;
}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.myear{font-size:12.5px;font-weight:700;color:var(--ink-2);letter-spacing:.02em}

.mrow{display:flex;align-items:center;gap:4px;margin-top:2px}
.mnum{font-size:31px;font-weight:800;letter-spacing:-.045em;line-height:1.1;
  min-width:74px;text-align:center}
.mrow button{
  height:34px;min-width:34px;border:0;border-radius:999px;cursor:pointer;
  background:rgba(255,255,255,.6);color:var(--ink);
  font-family:inherit;font-size:16px;line-height:1;flex:none;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.mrow button:active{background:#fff}
.mrow button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.status{display:flex;align-items:center;gap:5px;margin-top:7px;
  font-size:11.5px;color:var(--ink-2);cursor:pointer}
.dot{width:5px;height:5px;border-radius:50%;background:var(--ink-3);flex:none}
.status[data-live="on"] .dot{background:#2FBE7E}
.status[data-live="err"] .dot{background:#F0544F}

/* 달력 / 통계 전환 */
.toggle{display:flex;gap:2px;background:rgba(255,255,255,.55);border-radius:999px;
  padding:4px;flex:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.toggle button{
  width:40px;height:36px;border:0;background:none;border-radius:999px;
  display:grid;place-items:center;cursor:pointer;color:var(--ink-2);
  transition:background .16s,color .16s;
}
.toggle button[aria-pressed="true"]{background:#fff;color:var(--ink);
  box-shadow:0 2px 8px rgba(60,40,110,.13)}
.toggle svg{width:19px;height:19px;display:block}

/* 필터 */
.filters{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.sel{position:relative;flex:none}
.sel[hidden]{display:none}
.sel select{
  appearance:none;-webkit-appearance:none;font-family:inherit;
  font-size:12.5px;font-weight:700;color:var(--ink);
  background:rgba(255,255,255,.6);border:0;border-radius:999px;
  padding:0 25px 0 13px;height:32px;max-width:145px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.sel::after{content:"";position:absolute;right:11px;top:50%;width:5px;height:5px;
  margin-top:-4px;border-right:1.6px solid var(--ink-2);border-bottom:1.6px solid var(--ink-2);
  transform:rotate(45deg);pointer-events:none}
.sel[data-on="1"] select{background:var(--ink);color:#fff}
.sel[data-on="1"]::after{border-color:#fff}
.reset{flex:none;height:32px;padding:0 10px;border:0;background:none;color:var(--ink-2);
  font-family:inherit;font-size:12.5px;font-weight:700;text-decoration:underline;
  text-underline-offset:3px;cursor:pointer}

/* 달력 */
.cal{margin-top:16px;touch-action:pan-y}
.cal[hidden]{display:none}
.dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
.dow span{text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-2);
  opacity:.75;letter-spacing:.08em;padding:4px 0}

.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cell{position:relative;border:0;background:none;padding:3px 0 4px;min-height:50px;
  font-family:inherit;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:5px}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:14px}
.num{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;
  font-size:14.5px;font-weight:600;color:var(--ink);
  transition:background .16s,box-shadow .16s}
.cell.dim .num{color:var(--ink-3);opacity:.55}
.cell.today .num{color:var(--accent);font-weight:800}
.cell.sel .num{background:#fff;font-weight:800;box-shadow:0 4px 14px rgba(70,45,130,.18)}

.dots{display:flex;gap:3px;height:8px;align-items:center}
.dots i{width:7px;height:7px;flex:none}
.dots i.ci{border-radius:50%}
.dots i.sq{border-radius:1.5px}
.dots i.star{
  width:8px;height:8px;
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
}

/* ── 흰 시트 ───────────────────────────────────── */
.sheet{background:var(--sheet);border-radius:26px 26px 0 0;margin-top:-20px;
  position:relative;z-index:1;min-height:56vh;
  padding:22px 0 calc(40px + env(safe-area-inset-bottom))}

.shead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:16px}
.shead h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.03em}
.shead .n{font-size:12px;font-weight:700;color:var(--ink-3)}

/* 강의 카드 */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:stretch}
.rail{flex:none;width:46px;padding-top:12px;text-align:right}
.rail b{display:block;font-size:13.5px;font-weight:800;letter-spacing:-.02em}
.rail span{display:block;font-size:10.5px;font-weight:600;color:var(--ink-3);margin-top:1px}

.card{flex:1;min-width:0;display:flex;align-items:center;gap:11px;
  border-radius:20px;padding:11px 15px 11px 11px}
.ava{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  color:#fff;font-size:15px;font-weight:800;letter-spacing:-.02em}
.info{min-width:0}
.info b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.02em;
  word-break:keep-all;line-height:1.3}
.info span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px;
  word-break:keep-all;line-height:1.35}

/* 통계 */
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.mini{background:#F7F6FB;border-radius:16px;padding:13px 12px;text-align:center}
.mini b{display:block;font-size:21px;font-weight:800;letter-spacing:-.04em}
.mini span{display:block;font-size:11px;font-weight:600;color:var(--ink-2);margin-top:2px}

.tabs{display:flex;gap:5px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:32px;padding:0 14px;border:0;border-radius:999px;
  background:#F2F1F7;color:var(--ink-2);font-family:inherit;font-size:12.5px;
  font-weight:700;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}

.stats{display:flex;flex-direction:column;gap:13px}
.stat .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.stat .nm{font-size:13.5px;font-weight:700;letter-spacing:-.01em;word-break:keep-all}
.stat .ct{font-size:12.5px;font-weight:800;color:var(--ink-2);flex:none}
.track{height:8px;border-radius:999px;background:#F2F1F7;overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;transition:width .3s ease}

.empty{text-align:center;color:var(--ink-3);font-size:13.5px;padding:34px 14px;
  background:#F9F8FC;border-radius:18px;line-height:1.6}
.empty button{display:block;margin:12px auto 0;border:0;background:var(--ink);color:#fff;
  font-family:inherit;font-size:12.5px;font-weight:700;padding:9px 16px;
  border-radius:999px;cursor:pointer}
.empty b{color:var(--ink-2)}

footer{padding:22px 0 30px;text-align:center;font-size:10.5px;color:var(--ink-3)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="hero">
  <div class="wrap">
    <div class="bar">
      <div class="myear" id="year"></div>
      <div class="toggle">
        <button id="tabCal" aria-pressed="true" aria-label="달력 보기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>
          </svg>
        </button>
        <button id="tabStat" aria-pressed="false" aria-label="통계 보기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round">
            <path d="M5 20V10M12 20V4M19 20v-6"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="mrow">
      <button id="prev" aria-label="이전 달">‹</button>
      <div class="mnum" id="month"></div>
      <button id="next" aria-label="다음 달">›</button>
    </div>

    <div class="status" id="status" data-live="off">
      <span class="dot"></span><span id="statusText">불러오는 중</span>
    </div>

    <div class="filters">
      <label class="sel" id="wDivision"><select id="fDivision"></select></label>
      <label class="sel" id="wRegion"><select id="fRegion"></select></label>
      <label class="sel" id="wBranch"><select id="fBranch"></select></label>
      <label class="sel" id="wTeacher"><select id="fTeacher"></select></label>
      <button class="reset" id="reset" hidden>초기화</button>
    </div>

    <section class="cal" id="cal">
      <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div class="grid" id="grid"></div>
    </section>
  </div>
</div>

<div class="sheet">
  <div class="wrap" id="sheetBody"></div>
  <footer id="foot"></footer>
</div>

<script>
/* ==================================================================
   1. 설정 — 여기만 바꾸면 됩니다
   ================================================================== */
const CONFIG = {
  // 'apps' = 앱스스크립트 웹앱 (현재 설정). 시트를 비공개로 둘 수 있고 즉시 반영됩니다.
  // 'gviz' = 시트를 공개로 열고 직접 읽기. SHEET_ID 필요.
  // 'csv'  = 웹에 게시한 주소. 반영에 몇 분 걸립니다.
  MODE: 'apps',

  API_URL: 'https://script.google.com/macros/s/AKfycbxkavyA19xksQboxRk85VERhk-hzCEPA8ST0aButxNMpVLH7SAjMXVlIrw9XPo946Mw/exec',

  CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRoLGs326k1MMHyrnrd-xlG6tc6erUNRgCmbEBa2-ZhHV3Wut03lEsnDd1UO_LO1_06_TwxC_cBCrHo/pub?gid=0&single=true&output=csv',

  SHEET_ID: 'PUT_YOUR_SHEET_ID_HERE',
  SHEET_NAME: '시트1',

  // 카드 색과 달력 점의 기준: 'region' | 'division' | 'branch' | 'teacher'
  COLOR_BY: 'region',

  // 이 시각에만 시트를 다시 읽습니다 (24시간제)
  UPDATE_HOURS: [9, 12, 15, 18],
};

/* 시트 첫 줄(헤더)을 아래 이름으로 찾습니다. 순서가 달라도 되고, 없는 열이 있어도 됩니다 */
const ALIASES = {
  date:     ['일자','날짜','date','강의일','수업일'],
  time:     ['시간','시각','time','강의시간','수업시간'],
  division: ['영업부','부서','본부','division'],
  region:   ['권역','지역','구역','region'],
  branch:   ['지점','지사','branch'],
  center:   ['센터','center','교육장'],
  teacher:  ['강사','강사명','teacher','instructor','선생님'],
  title:    ['강의명','과목','수업명','프로그램','title'],
  status:   ['상태','현황','진행상태','status'],
  note:     ['비고','메모','note'],
};

/* 상단 필터 — 앞의 선택이 뒤의 목록을 좁힙니다 */
const FIELDS = [
  { key:'division', id:'fDivision', wrap:'wDivision', label:'전체 영업부' },
  { key:'region',   id:'fRegion',   wrap:'wRegion',   label:'전체 권역' },
  { key:'branch',   id:'fBranch',   wrap:'wBranch',   label:'전체 지점' },
  { key:'teacher',  id:'fTeacher',  wrap:'wTeacher',  label:'전체 강사' },
];

/* 통계 탭 */
const STAT_TABS = [
  { key:'division', label:'영업부' },
  { key:'region',   label:'권역' },
  { key:'branch',   label:'지점' },
  { key:'teacher',  label:'강사' },
];

/* 달력 표식 모양 — 이름을 넣고 빼기만 하면 됩니다. 목록에 없는 강사는 원형입니다 */
const SHAPE_STAR   = ['장종우','김남곤','임세연','신혜경','오윤정'];
const SHAPE_SQUARE = ['성홍록','박세진','김창수','김두기','박경철','황정식','이현희'];

/* [카드 배경, 원형 배지] 색 쌍 */
const PAIRS = [
  ['#FFE1E7','#FF7A93'],
  ['#E6E2FF','#7B6BF0'],
  ['#DAEEFF','#3EA0F0'],
  ['#DDF5E8','#2FBE7E'],
  ['#FFEBD4','#FF9F45'],
  ['#F3E4FF','#B06BE8'],
];

/* ==================================================================
   2. 상태
   ================================================================== */
const DOW = ['일','월','화','수','목','금','토'];

let rows = [];
let byDate = new Map();
let view = startOfMonth(new Date());
let selected = keyOf(new Date());
let filters = { division:'', region:'', branch:'', teacher:'' };
let panel = 'cal';                       // 'cal' | 'stats'
let statBy = 'branch';
let lastSync = null;
let timer = null;

const $ = id => document.getElementById(id);

/* ==================================================================
   3. 데이터 가져오기
   ================================================================== */
async function load({ silent = false } = {}) {
  if (!silent) setStatus('off', '불러오는 중');
  try {
    rows = CONFIG.MODE === 'apps' ? await fetchApi()
         : CONFIG.MODE === 'csv'  ? await fetchCsv()
         : await fetchGviz();
    index();
    buildFilters();
    lastSync = Date.now();
    setStatus('on', syncLabel());
    render();
  } catch (err) {
    console.error(err);
    setStatus('err', rows.length ? '새로고침 실패' : '불러오지 못했습니다');
    if (!rows.length) { $('grid').innerHTML = ''; $('sheetBody').innerHTML = errorBox(err); }
  }
}

/* 앱스스크립트 웹앱에서 { headers, rows } 형태로 받습니다.
   헤더를 붙이면 preflight 요청이 생겨 차단되니 그냥 fetch만 합니다 */
async function fetchApi() {
  const u = CONFIG.API_URL;
  if (!u || u.startsWith('PUT_')) throw new Error('API_URL이 비어 있습니다');
  const res = await fetch(u + (u.includes('?') ? '&' : '?') + 't=' + Date.now());
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (data.error) throw new Error(data.error);

  const map = mapFields(data.headers || []);
  return (data.rows || [])
    .map(r => normalize(map, i => ({ v: r[i] ?? null, f: r[i] ?? null })))
    .filter(Boolean);
}

async function fetchGviz() {
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq`
            + `?tqx=out:json&headers=1&sheet=${encodeURIComponent(CONFIG.SHEET_NAME)}&t=${Date.now()}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  const json = JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1));
  if (json.status === 'error') throw new Error(json.errors?.[0]?.detailed_message || '시트 응답 오류');

  const map = mapFields(json.table.cols.map(c => c.label || c.id));
  return json.table.rows.map(r => {
    const cells = (r.c || []).map(c => c ? { v:c.v, f:c.f } : { v:null, f:null });
    return normalize(map, i => cells[i] || { v:null, f:null });
  }).filter(Boolean);
}

async function fetchCsv() {
  if (!CONFIG.CSV_URL) throw new Error('CSV_URL이 비어 있습니다');
  const u = CONFIG.CSV_URL;
  const res = await fetch(u + (u.includes('?') ? '&' : '?') + 't=' + Date.now());
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const table = parseCsv(await res.text());
  if (!table.length) return [];
  const map = mapFields(table[0]);
  return table.slice(1)
    .filter(r => r.some(c => String(c).trim()))
    .map(r => normalize(map, i => ({ v:r[i] ?? null, f:r[i] ?? null })))
    .filter(Boolean);
}

function parseCsv(text) {
  const out = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); out.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); out.push(row); }
  return out;
}

/* ==================================================================
   4. 열 매칭 · 값 정규화
   ================================================================== */
function mapFields(headers) {
  const norm = h => String(h ?? '').replace(/\s|_|-/g, '').toLowerCase();
  const map = {};
  headers.forEach((h, i) => {
    const n = norm(h);
    for (const [field, names] of Object.entries(ALIASES)) {
      if (map[field] == null && names.some(a => norm(a) === n)) map[field] = i;
    }
  });
  return map;
}

function normalize(map, cell) {
  const get = f => map[f] == null ? null : cell(map[f]);
  const date = toDateKey(get('date'));
  if (!date) return null;

  const rec = {
    date,
    time:     toTime(get('time')),
    division: txt(get('division')),
    region:   txt(get('region')),
    branch:   txt(get('branch')),
    center:   txt(get('center')),
    teacher:  txt(get('teacher')),
    title:    txt(get('title')),
    status:   txt(get('status')),
    note:     txt(get('note')),
  };
  rec.sort = sortKey(rec.time);
  return rec;
}

const txt = c => c == null ? '' : String(c.f ?? c.v ?? '').trim();

function ymd8(s) {
  const y = +s.slice(0,4), m = +s.slice(4,6), d = +s.slice(6,8);
  if (m < 1 || m > 12 || d < 1 || d > 31) return null;
  return keyOf(new Date(y, m - 1, d));
}

function toDateKey(c) {
  if (!c) return null;
  const v = c.v;
  if (typeof v === 'number' && v >= 19000101 && v <= 29991231) return ymd8(String(Math.trunc(v)));
  if (typeof v === 'string' && v.startsWith('Date(')) {
    const [y, m, d] = v.slice(5, -1).split(',').map(Number);
    return keyOf(new Date(y, m, d));
  }
  if (v instanceof Date) return keyOf(v);

  const s = String(v ?? c.f ?? '').replace(/[\s,]/g, '');
  if (!s) return null;
  if (/^\d{8}$/.test(s)) return ymd8(s);

  let m = s.match(/(\d{4})\D{1,2}(\d{1,2})\D{1,2}(\d{1,2})/);
  if (m) return keyOf(new Date(+m[1], +m[2] - 1, +m[3]));
  m = s.match(/^(\d{1,2})\D{1,2}(\d{1,2})$/);
  if (m) return keyOf(new Date(view.getFullYear(), +m[1] - 1, +m[2]));

  const d = new Date(s);
  return isNaN(d) ? null : keyOf(d);
}

function toTime(c) {
  if (!c) return '';
  const v = c.v;
  if (typeof v === 'number') {
    if (v > 0 && v < 1) { const t = Math.round(v * 1440); return pad(Math.floor(t/60)) + ':' + pad(t%60); }
    if (v >= 0 && v <= 2359) { const n = Math.trunc(v); return pad(Math.floor(n/100)) + ':' + pad(n%100); }
  }
  if (typeof v === 'string' && v.startsWith('Date(')) {
    const p = v.slice(5, -1).split(',').map(Number);
    return pad(p[3] || 0) + ':' + pad(p[4] || 0);
  }
  const s = String(v ?? c.f ?? '').replace(/[\s,]/g, '');
  if (/^\d{3,4}$/.test(s)) { const n = +s; return pad(Math.floor(n/100)) + ':' + pad(n%100); }
  const m = s.match(/^(\d{1,2}):(\d{2})/);
  if (m) return pad(+m[1]) + ':' + m[2];
  return String(c.f ?? v ?? '').trim();
}

function sortKey(t) {
  const m = String(t).match(/(\d{1,2}):(\d{2})/);
  return m ? +m[1] * 60 + +m[2] : 9999;
}

/* ==================================================================
   5. 인덱싱 · 필터 · 색
   ================================================================== */
function index() {
  byDate = new Map();
  for (const r of rows) {
    if (!byDate.has(r.date)) byDate.set(r.date, []);
    byDate.get(r.date).push(r);
  }
  for (const list of byDate.values()) list.sort((a, b) => a.sort - b.sort);
}

const passes = (r, except) =>
  FIELDS.every(f => f.key === except || !filters[f.key] || r[f.key] === filters[f.key]);

const dayItems = key => (byDate.get(key) || []).filter(r => passes(r));
const monthItems = () => rows.filter(r =>
  passes(r) && r.date.slice(0, 7) === keyOf(view).slice(0, 7));

function buildFilters() {
  for (const f of FIELDS) {
    const el = $(f.id);
    const vals = [...new Set(rows.filter(r => passes(r, f.key)).map(r => r[f.key]).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, 'ko'));
    if (filters[f.key] && !vals.includes(filters[f.key])) vals.push(filters[f.key]);

    el.innerHTML = `<option value="">${f.label}</option>`
      + vals.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
    el.value = filters[f.key];
    $(f.wrap).dataset.on = filters[f.key] ? '1' : '0';
    $(f.wrap).hidden = vals.length === 0;
  }
  $('reset').hidden = !FIELDS.some(f => filters[f.key]);
}

/* 같은 이름은 언제나 같은 색 */
const hueOf = (() => {
  const cache = new Map();
  return name => {
    if (!name) return ['#F1F0F6', '#B7B3C4'];
    if (!cache.has(name)) {
      let h = 0;
      for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      cache.set(name, PAIRS[h % PAIRS.length]);
    }
    return cache.get(name);
  };
})();

const colorKey = r => r[CONFIG.COLOR_BY] || r.branch || r.center;

/* 공백을 지우고 비교하므로 시트에 '장 종우'처럼 띄어 써도 인식합니다 */
function shapeOf(teacher) {
  const n = String(teacher || '').replace(/\s/g, '');
  if (SHAPE_STAR.includes(n)) return 'star';
  if (SHAPE_SQUARE.includes(n)) return 'sq';
  return 'ci';
}

/* ==================================================================
   6. 렌더
   ================================================================== */
function render() { renderMonth(); renderSheet(); }

function renderMonth() {
  $('year').textContent = view.getFullYear() + '년';
  $('month').textContent = (view.getMonth() + 1) + '월';

  const first = startOfMonth(view);
  const start = new Date(first);
  start.setDate(1 - first.getDay());
  const todayKey = keyOf(new Date());
  const cells = [];

  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    if (i >= 35 && d.getMonth() !== view.getMonth()) break;

    const key = keyOf(d);
    const items = dayItems(key);
    const cls = ['cell'];
    if (d.getMonth() !== view.getMonth()) cls.push('dim');
    if (key === selected) cls.push('sel');
    if (key === todayKey) cls.push('today');

    // 같은 모양·같은 색은 한 번만 찍고 최대 3개까지 보여줍니다
    const seen = new Set(), marks = [];
    for (const r of items) {
      const g = colorKey(r), sh = shapeOf(r.teacher), k = sh + '|' + g;
      if (seen.has(k)) continue;
      seen.add(k);
      marks.push(`<i class="${sh}" style="background:${hueOf(g)[1]}"></i>`);
      if (marks.length === 3) break;
    }
    const dots = marks.join('');

    cells.push(
      `<button class="${cls.join(' ')}" data-key="${key}" type="button"
               aria-label="${d.getMonth()+1}월 ${d.getDate()}일 강의 ${items.length}건"
               ${key === selected ? 'aria-current="date"' : ''}>
         <span class="num">${d.getDate()}</span>
         <span class="dots">${dots}</span>
       </button>`
    );
  }
  $('grid').innerHTML = cells.join('');
}

function renderSheet() {
  const stats = panel === 'stats';
  $('tabCal').setAttribute('aria-pressed', !stats);
  $('tabStat').setAttribute('aria-pressed', stats);
  $('cal').hidden = stats;                    // 통계에서는 달력을 감춥니다
  $('sheetBody').innerHTML = stats ? statsHtml() : dayHtml();
}

/* ── 날짜별 강의 목록 ── */
function dayHtml() {
  const d = fromKey(selected);
  const items = dayItems(selected);
  const all = byDate.get(selected) || [];

  const head = `<div class="shead">
      <h2>${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}</h2>
      <span class="n">${items.length ? '강의 ' + items.length + '건' : ''}</span>
    </div>`;

  if (!items.length) {
    return head + (all.length
      ? `<div class="empty">필터에 맞는 강의가 없습니다.
           <button type="button" onclick="clearFilters()">필터 초기화</button></div>`
      : `<div class="empty">이 날짜에 등록된 강의가 없습니다.</div>`);
  }

  const list = items.map(r => {
    const [soft, solid] = hueOf(colorKey(r));
    const h = parseInt(r.time, 10);
    const ampm = isNaN(h) ? '' : (h < 12 ? '오전' : '오후');
    const title = r.title || r.branch || r.center || '강의';
    const sub = [r.division, r.region, r.center, r.branch, r.teacher, r.status, r.note]
      .filter(Boolean).filter(x => x !== title).join(' · ');
    const mark = (r.teacher || r.branch || '·').trim().charAt(0);

    return `<div class="row">
      <div class="rail"><b>${esc(r.time || '—')}</b><span>${ampm}</span></div>
      <div class="card" style="background:${soft}">
        <div class="ava" style="background:${solid}">${esc(mark)}</div>
        <div class="info"><b>${esc(title)}</b><span>${esc(sub)}</span></div>
      </div>
    </div>`;
  }).join('');

  return head + `<div class="list">${list}</div>`;
}

/* ── 통계 ── */
function statsHtml() {
  const items = monthItems();
  const head = `<div class="shead">
      <h2>${view.getMonth() + 1}월 통계</h2>
      <span class="n">${FIELDS.some(f => filters[f.key]) ? '필터 적용됨' : '전체'}</span>
    </div>`;

  if (!items.length) return head + `<div class="empty">이 달에 집계할 강의가 없습니다.</div>`;

  const days = new Set(items.map(r => r.date)).size;
  const people = new Set(items.map(r => r.teacher).filter(Boolean)).size;
  const mini = `<div class="cards3">
      <div class="mini"><b>${items.length}</b><span>총 강의</span></div>
      <div class="mini"><b>${days}</b><span>강의일</span></div>
      <div class="mini"><b>${people}</b><span>강사</span></div>
    </div>`;

  const tabs = `<div class="tabs">` + STAT_TABS.map(t =>
    `<button type="button" data-stat="${t.key}" aria-pressed="${statBy === t.key}">${t.label}</button>`
  ).join('') + `</div>`;

  const tally = new Map();
  for (const r of items) {
    const k = r[statBy] || '미지정';
    tally.set(k, (tally.get(k) || 0) + 1);
  }
  const ranked = [...tally.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ko'));
  const max = ranked[0][1];

  const bars = ranked.map(([name, n]) => {
    const solid = hueOf(name)[1];
    return `<div class="stat">
      <div class="top"><span class="nm">${esc(name)}</span><span class="ct">${n}회</span></div>
      <div class="track"><i style="width:${Math.round(n / max * 100)}%;background:${solid}"></i></div>
    </div>`;
  }).join('');

  return head + mini + tabs + `<div class="stats">${bars}</div>`;
}

function errorBox(err) {
  const hint = CONFIG.MODE === 'apps'
    ? `웹 앱 배포에서 <b>액세스 권한이 있는 사용자</b>가 <b>모든 사용자</b>인지,
       주소가 <b>/exec</b>로 끝나는지 확인해 주세요.`
    : `시트 공유가 <b>링크가 있는 모든 사용자 · 뷰어</b>인지 확인해 주세요.`;
  return `<div class="empty">데이터를 불러오지 못했습니다.<br>${hint}
    <br><b>${esc(err.message || '')}</b>
    <button type="button" onclick="load()">다시 시도</button></div>`;
}

function setStatus(state, text) { $('status').dataset.live = state; $('statusText').textContent = text; }

function syncLabel() {
  if (!lastSync) return '';
  const d = new Date(lastSync);
  const day = keyOf(d) === keyOf(new Date()) ? '오늘' : `${d.getMonth() + 1}월 ${d.getDate()}일`;
  return `${day} ${pad(d.getHours())}:${pad(d.getMinutes())} 업데이트 · 다음 ${pad(nextSlot().getHours())}:00`;
}

/* ==================================================================
   7. 이벤트
   ================================================================== */
$('grid').addEventListener('click', e => {
  const btn = e.target.closest('.cell');
  if (!btn) return;
  selected = btn.dataset.key;
  const d = fromKey(selected);
  if (d.getMonth() !== view.getMonth() || d.getFullYear() !== view.getFullYear()) view = startOfMonth(d);
  panel = 'cal';                              // 날짜를 고르면 목록으로 돌아옵니다
  render();
});

$('sheetBody').addEventListener('click', e => {
  const b = e.target.closest('[data-stat]');
  if (!b) return;
  statBy = b.dataset.stat;
  renderSheet();
});

$('tabCal').onclick = () => { panel = 'cal'; renderSheet(); };
$('tabStat').onclick = () => { panel = 'stats'; renderSheet(); };

$('prev').onclick = () => shiftMonth(-1);
$('next').onclick = () => shiftMonth(1);
function shiftMonth(n) { view = new Date(view.getFullYear(), view.getMonth() + n, 1); render(); }

for (const f of FIELDS) {
  $(f.id).addEventListener('change', e => {
    filters[f.key] = e.target.value;
    buildFilters();
    render();
  });
}
function clearFilters() { for (const f of FIELDS) filters[f.key] = ''; buildFilters(); render(); }
$('reset').onclick = clearFilters;

let sx = 0, sy = 0;
$('cal').addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive:true });
$('cal').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 55 && Math.abs(dy) < 45) shiftMonth(dx < 0 ? 1 : -1);
}, { passive:true });

/* ==================================================================
   8. 갱신 — 정해진 시각에만
   ================================================================== */
const SLOTS = [...CONFIG.UPDATE_HOURS].sort((a, b) => a - b);

function slotAt(h, dayOffset = 0) {
  const t = new Date();
  t.setDate(t.getDate() + dayOffset);
  t.setHours(h, 0, 0, 0);
  return t;
}
function nextSlot() {
  const now = Date.now();
  for (const h of SLOTS) { const t = slotAt(h); if (t.getTime() > now) return t; }
  return slotAt(SLOTS[0], 1);
}
function prevSlot() {
  const now = Date.now();
  for (let i = SLOTS.length - 1; i >= 0; i--) { const t = slotAt(SLOTS[i]); if (t.getTime() <= now) return t; }
  return slotAt(SLOTS[SLOTS.length - 1], -1);
}
function scheduleNext() {
  clearTimeout(timer);
  timer = setTimeout(() => load({ silent:true }).then(scheduleNext),
                     Math.max(1000, nextSlot().getTime() - Date.now()));
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearTimeout(timer); timer = null; return; }
  if (!lastSync || lastSync < prevSlot().getTime()) load({ silent:true }).then(scheduleNext);
  else { setStatus('on', syncLabel()); scheduleNext(); }
});

$('status').addEventListener('click', () => load());
setInterval(() => { if ($('status').dataset.live === 'on') $('statusText').textContent = syncLabel(); }, 60000);

/* ==================================================================
   9. 유틸
   ================================================================== */
function pad(n){ return String(n).padStart(2,'0'); }
function keyOf(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function fromKey(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

load().then(scheduleNext);
$('foot').textContent = '업데이트 ' + SLOTS.map(h => pad(h) + ':00').join(' · ');
</script>
</body>
</html>
