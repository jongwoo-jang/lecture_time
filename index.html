<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFBF9">
<title>강의 현황</title>
<style>
:root{
  --paper:#FBFBF9;
  --card:#FFFFFF;
  --ink:#14151A;
  --ink-2:#5C6068;
  --ink-3:#8E939B;
  --rule:#E5E5E0;

  /* 선택/오늘 전용 형광펜 */
  --hl:#D6F24A;

  /* 구분용 형광펜 */
  --c1:#9FE3F7;
  --c2:#FFC2DC;
  --c3:#FFCE8F;
  --c4:#CFC3F7;
  --c5:#A8EBC8;
  --c6:#F7D9A0;

  --r:12px;
  --tap:44px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#131417; --card:#191B1F;
    --ink:#F2F2EF; --ink-2:#9A9EA6; --ink-3:#6E727A;
    --rule:#2A2D33;
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
              "Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
  padding:0 0 env(safe-area-inset-bottom);
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

/* 헤더 */
.top{padding-top:calc(14px + env(safe-area-inset-top))}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none}
.status[data-live="on"] .dot{background:#3FBF6B;box-shadow:0 0 0 3px rgba(63,191,107,.16)}
.status[data-live="err"] .dot{background:#E0563F;box-shadow:none}

.monthbar{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px}
.mtitle{display:flex;align-items:baseline;gap:8px}
.myear{font-size:13px;color:var(--ink-3);font-weight:600}
.mnum{font-size:32px;font-weight:800;letter-spacing:-.04em;line-height:1}
.nav{display:flex;align-items:center;gap:2px}
.nav button{
  height:var(--tap);min-width:var(--tap);
  border:0;background:none;color:var(--ink);
  font-size:19px;font-family:inherit;cursor:pointer;border-radius:10px;
}
.nav .today{min-width:auto;padding:0 12px;height:34px;font-size:13px;font-weight:700;
  border:1px solid var(--rule);border-radius:999px}
.nav button:active{background:var(--rule)}
.nav button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* 필터 */
.filters{display:flex;gap:6px;margin-top:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.sel{position:relative;flex:none}
.sel[hidden]{display:none}
.sel select{
  appearance:none;-webkit-appearance:none;
  font-family:inherit;font-size:13px;font-weight:600;
  color:var(--ink);background:var(--card);
  border:1px solid var(--rule);border-radius:999px;
  padding:8px 26px 8px 13px;height:34px;max-width:150px;text-overflow:ellipsis;
}
.sel::after{
  content:"";position:absolute;right:11px;top:50%;
  width:5px;height:5px;margin-top:-4px;
  border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);
  transform:rotate(45deg);pointer-events:none;
}
.sel[data-on="1"] select{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.sel[data-on="1"]::after{border-color:var(--paper)}
.reset{flex:none;height:34px;padding:0 13px;border:0;background:none;
  color:var(--ink-3);font-family:inherit;font-size:13px;font-weight:600;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* 달력 */
.cal{margin-top:16px;touch-action:pan-y}
.dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
.dow span{text-align:center;font-size:11px;font-weight:700;color:var(--ink-3);
  letter-spacing:.06em;padding:6px 0}
.dow span:first-child{color:#D8604A}

.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px 0}
.cell{position:relative;border:0;background:none;padding:5px 0 6px;min-height:58px;
  font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.cell:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;border-radius:8px}

.num{position:relative;z-index:1;font-size:14px;font-weight:600;color:var(--ink);
  width:28px;height:22px;display:grid;place-items:center}
.cell.sun .num{color:#D8604A}
.cell.dim .num{color:var(--ink-3);font-weight:500}

/* 형광펜 자국 */
.swipe{
  position:absolute;top:5px;left:50%;
  width:30px;height:21px;margin-left:-15px;
  background:var(--hl);border-radius:3px 7px 4px 8px;
  transform:rotate(-1.2deg) scaleX(0);transform-origin:left center;
  opacity:0;pointer-events:none;mix-blend-mode:multiply;
}
@media (prefers-color-scheme: dark){
  .swipe{mix-blend-mode:normal}
  .cell.sel .num,.cell.sel.sun .num{color:#14151A}
}
.cell.sel .swipe{opacity:1;transform:rotate(-1.2deg) scaleX(1);
  transition:transform .19s cubic-bezier(.3,.9,.4,1)}
.cell.today .num::after{content:"";position:absolute;left:4px;right:4px;bottom:1px;
  height:2px;background:var(--ink);border-radius:2px}

.marks{display:flex;flex-direction:column;gap:2.5px;align-items:center;min-height:8px}
.mark{width:18px;height:2.5px;border-radius:2px}
.more{font-size:9px;font-weight:700;color:var(--ink-3);line-height:1;margin-top:1px}

/* 상세 */
.sheet{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.dayhead{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.dayhead h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.count{font-size:12px;font-weight:600;color:var(--ink-3)}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--rule);
  border-radius:var(--r);padding:13px 14px;position:relative;overflow:hidden}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bar,var(--rule))}
.time{flex:none;width:50px;font-size:15px;font-weight:800;letter-spacing:-.02em;padding-left:2px}
.meta{min-width:0;flex:1}
.meta .who{font-size:15px;font-weight:700;letter-spacing:-.01em;word-break:keep-all}
.meta .where{margin-top:4px;font-size:13px;color:var(--ink-2);word-break:keep-all}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#14151A;
  background:var(--bar,var(--rule));border-radius:4px;padding:2px 6px;margin-right:5px}

.empty{text-align:center;color:var(--ink-3);font-size:13.5px;padding:28px 12px;
  border:1px dashed var(--rule);border-radius:var(--r)}
.empty button{display:block;margin:10px auto 0;border:1px solid var(--rule);background:var(--card);
  color:var(--ink);font-family:inherit;font-size:13px;font-weight:700;
  padding:8px 14px;border-radius:999px;cursor:pointer}

.banner{margin-top:14px;padding:11px 13px;border-radius:10px;
  background:color-mix(in srgb,var(--hl) 40%,var(--paper));
  border:1px solid color-mix(in srgb,var(--hl) 60%,var(--rule));
  font-size:12.5px;line-height:1.55;color:var(--ink)}
.banner code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.banner[hidden]{display:none}

footer{padding:26px 0 32px;text-align:center;font-size:11px;color:var(--ink-3)}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
  .cell.sel .swipe{transform:rotate(-1.2deg) scaleX(1)}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="status" id="status" data-live="off">
      <span class="dot"></span><span id="statusText">시트 불러오는 중</span>
    </div>
    <div class="monthbar">
      <div class="mtitle">
        <span class="myear" id="year"></span>
        <span class="mnum" id="month"></span>
      </div>
      <nav class="nav">
        <button id="prev" aria-label="이전 달">‹</button>
        <button class="today" id="todayBtn">오늘</button>
        <button id="next" aria-label="다음 달">›</button>
      </nav>
    </div>

    <div class="filters">
      <label class="sel" id="wDivision"><select id="fDivision"></select></label>
      <label class="sel" id="wRegion"><select id="fRegion"></select></label>
      <label class="sel" id="wBranch"><select id="fBranch"></select></label>
      <label class="sel" id="wTeacher"><select id="fTeacher"></select></label>
      <button class="reset" id="reset" hidden>초기화</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <section class="cal" id="cal">
    <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="sheet">
    <div class="dayhead">
      <h2 id="dayTitle">날짜를 선택하세요</h2>
      <span class="count" id="dayCount"></span>
    </div>
    <div class="list" id="list"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
/* ==================================================================
   1. 설정 — 여기만 바꾸면 됩니다
   ================================================================== */
const CONFIG = {
  // 'csv'  = 웹에 게시한 주소 사용. 지금 이 설정입니다. 반영에 몇 분 걸립니다.
  // 'gviz' = 즉시 반영. 아래 SHEET_ID를 채우고 시트 공유를 열어야 합니다.
  MODE: 'csv',

  // 웹에 게시 주소. 끝을 pubhtml → pub?...&output=csv 로 바꾼 형태입니다
  CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRoLGs326k1MMHyrnrd-xlG6tc6erUNRgCmbEBa2-ZhHV3Wut03lEsnDd1UO_LO1_06_TwxC_cBCrHo/pub?gid=0&single=true&output=csv',

  // MODE를 'gviz'로 바꿀 때만 필요합니다.
  // 게시 주소가 아니라 평소 편집하는 주소의 /d/ 와 /edit 사이 문자열을 넣으세요
  SHEET_ID: 'PUT_YOUR_SHEET_ID_HERE',
  SHEET_NAME: '시트1',

  // 달력 막대와 카드 색 기준: 'region' | 'division' | 'branch' | 'teacher'
  COLOR_BY: 'region',

  // 자동 새로고침 주기(ms). 화면이 백그라운드로 가면 멈춥니다.
  POLL_MS: 60000,
};

/* 시트 첫 줄(헤더)을 아래 이름으로 찾습니다. 순서가 달라도 되고, 없는 열이 있어도 됩니다.
   헤더 이름을 다르게 쓰신다면 해당 줄에 추가만 하면 인식됩니다. */
const ALIASES = {
  date:     ['일자','날짜','date','강의일','수업일'],
  time:     ['시간','시각','time','강의시간','수업시간'],
  division: ['영업부','부서','본부','division'],
  region:   ['권역','지역','구역','region'],
  branch:   ['지점','지사','branch'],
  center:   ['센터','center','교육장'],
  teacher:  ['강사','강사명','teacher','instructor','선생님'],
  title:    ['강의명','과목','수업명','프로그램','title'],
  status:   ['상태','현황','진행상태','status'],
  note:     ['비고','메모','note'],
};

/* 필터 목록 — 순서대로 칩이 표시되고, 앞의 선택이 뒤의 목록을 좁힙니다 */
const FIELDS = [
  { key:'division', id:'fDivision', wrap:'wDivision', label:'전체 영업부' },
  { key:'region',   id:'fRegion',   wrap:'wRegion',   label:'전체 권역' },
  { key:'branch',   id:'fBranch',   wrap:'wBranch',   label:'전체 지점' },
  { key:'teacher',  id:'fTeacher',  wrap:'wTeacher',  label:'전체 강사' },
];

/* ==================================================================
   2. 상태
   ================================================================== */
const PALETTE = ['--c1','--c2','--c3','--c4','--c5','--c6'];
const DOW = ['일','월','화','수','목','금','토'];

let rows = [];
let byDate = new Map();
let view = startOfMonth(new Date());
let selected = keyOf(new Date());
let filters = { division:'', region:'', branch:'', teacher:'' };
let lastSync = null;
let timer = null;

const $ = id => document.getElementById(id);

/* ==================================================================
   3. 데이터 가져오기
   ================================================================== */
async function load({ silent = false } = {}) {
  if (!silent) setStatus('off', '시트 불러오는 중');
  const isDemo = CONFIG.SHEET_ID === 'PUT_YOUR_SHEET_ID_HERE';
  try {
    rows = isDemo ? sampleRows()
         : (CONFIG.MODE === 'csv' ? await fetchCsv() : await fetchGviz());
    index();
    buildFilters();
    lastSync = Date.now();
    setStatus('on', '방금 업데이트');
    render();
    showBanner(isDemo
      ? '샘플 데이터입니다. 코드 상단 <code>CONFIG.SHEET_ID</code>에 시트 ID를 넣으면 실제 데이터로 바뀝니다.'
      : '');
  } catch (err) {
    console.error(err);
    setStatus('err', rows.length ? '새로고침 실패 · 이전 데이터 표시 중' : '불러오지 못했습니다');
    if (!rows.length) { $('grid').innerHTML = ''; $('list').innerHTML = errorBox(err); }
  }
}

async function fetchGviz() {
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq`
            + `?tqx=out:json&headers=1&sheet=${encodeURIComponent(CONFIG.SHEET_NAME)}&t=${Date.now()}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();

  // 응답이 google.visualization.Query.setResponse({...}); 로 감싸져 있어 벗겨냅니다
  const json = JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1));
  if (json.status === 'error') throw new Error(json.errors?.[0]?.detailed_message || '시트 응답 오류');

  const map = mapFields(json.table.cols.map(c => c.label || c.id));
  return json.table.rows
    .map(r => {
      const cells = (r.c || []).map(c => c ? { v:c.v, f:c.f } : { v:null, f:null });
      return normalize(map, i => cells[i] || { v:null, f:null });
    })
    .filter(Boolean);
}

async function fetchCsv() {
  if (!CONFIG.CSV_URL) throw new Error('CSV_URL이 비어 있습니다');
  const u = CONFIG.CSV_URL;
  const res = await fetch(u + (u.includes('?') ? '&' : '?') + 't=' + Date.now());
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const table = parseCsv(await res.text());
  if (!table.length) return [];
  const map = mapFields(table[0]);
  return table.slice(1)
    .filter(r => r.some(c => String(c).trim()))
    .map(r => normalize(map, i => ({ v:r[i] ?? null, f:r[i] ?? null })))
    .filter(Boolean);
}

function parseCsv(text) {
  const out = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); out.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); out.push(row); }
  return out;
}

/* ==================================================================
   4. 열 매칭 · 값 정규화
   ================================================================== */
function mapFields(headers) {
  const norm = h => String(h ?? '').replace(/\s|_|-/g, '').toLowerCase();
  const map = {};
  headers.forEach((h, i) => {
    const n = norm(h);
    for (const [field, names] of Object.entries(ALIASES)) {
      if (map[field] == null && names.some(a => norm(a) === n)) map[field] = i;
    }
  });
  return map;
}

function normalize(map, cell) {
  const get = f => map[f] == null ? null : cell(map[f]);
  const date = toDateKey(get('date'));
  if (!date) return null;                      // 날짜를 못 읽은 줄은 건너뜁니다

  const rec = {
    date,
    time:     toTime(get('time')),
    division: txt(get('division')),
    region:   txt(get('region')),
    branch:   txt(get('branch')),
    center:   txt(get('center')),
    teacher:  txt(get('teacher')),
    title:    txt(get('title')),
    status:   txt(get('status')),
    note:     txt(get('note')),
  };
  rec.sort = sortKey(rec.time);
  return rec;
}

const txt = c => c == null ? '' : String(c.f ?? c.v ?? '').trim();

function ymd8(s) {
  const y = +s.slice(0,4), m = +s.slice(4,6), d = +s.slice(6,8);
  if (m < 1 || m > 12 || d < 1 || d > 31) return null;
  return keyOf(new Date(y, m - 1, d));
}

function toDateKey(c) {
  if (!c) return null;
  const v = c.v;

  // 20260815 처럼 숫자로 들어온 YYYYMMDD
  if (typeof v === 'number' && v >= 19000101 && v <= 29991231) return ymd8(String(Math.trunc(v)));

  // 날짜 서식 셀은 gviz가 "Date(2026,7,13)" 로 줍니다. 월이 0부터라 그대로 넣습니다
  if (typeof v === 'string' && v.startsWith('Date(')) {
    const [y, m, d] = v.slice(5, -1).split(',').map(Number);
    return keyOf(new Date(y, m, d));
  }
  if (v instanceof Date) return keyOf(v);

  const s = String(v ?? c.f ?? '').replace(/[\s,]/g, '');
  if (!s) return null;
  if (/^\d{8}$/.test(s)) return ymd8(s);

  let m = s.match(/(\d{4})\D{1,2}(\d{1,2})\D{1,2}(\d{1,2})/);   // 2026-08-15, 2026.8.15
  if (m) return keyOf(new Date(+m[1], +m[2] - 1, +m[3]));

  m = s.match(/^(\d{1,2})\D{1,2}(\d{1,2})$/);                    // 8/15 → 보고 있는 연도로
  if (m) return keyOf(new Date(view.getFullYear(), +m[1] - 1, +m[2]));

  const d = new Date(s);
  return isNaN(d) ? null : keyOf(d);
}

function toTime(c) {
  if (!c) return '';
  const v = c.v;

  if (typeof v === 'number') {
    if (v > 0 && v < 1) {                       // 시간 서식(0.375 = 09:00)
      const t = Math.round(v * 1440);
      return pad(Math.floor(t / 60)) + ':' + pad(t % 60);
    }
    if (v >= 0 && v <= 2359) {                  // 900, 1000, 1600
      const n = Math.trunc(v);
      return pad(Math.floor(n / 100)) + ':' + pad(n % 100);
    }
  }
  if (typeof v === 'string' && v.startsWith('Date(')) {
    const p = v.slice(5, -1).split(',').map(Number);
    return pad(p[3] || 0) + ':' + pad(p[4] || 0);
  }

  const s = String(v ?? c.f ?? '').replace(/[\s,]/g, '');
  if (/^\d{3,4}$/.test(s)) { const n = +s; return pad(Math.floor(n / 100)) + ':' + pad(n % 100); }
  const m = s.match(/^(\d{1,2}):(\d{2})/);
  if (m) return pad(+m[1]) + ':' + m[2];
  return String(c.f ?? v ?? '').trim();
}

function sortKey(t) {
  const m = String(t).match(/(\d{1,2}):(\d{2})/);
  return m ? +m[1] * 60 + +m[2] : 9999;
}

/* ==================================================================
   5. 인덱싱 · 필터
   ================================================================== */
function index() {
  byDate = new Map();
  for (const r of rows) {
    if (!byDate.has(r.date)) byDate.set(r.date, []);
    byDate.get(r.date).push(r);
  }
  for (const list of byDate.values()) list.sort((a, b) => a.sort - b.sort);
}

const passes = (r, except) =>
  FIELDS.every(f => f.key === except || !filters[f.key] || r[f.key] === filters[f.key]);

const dayItems = key => (byDate.get(key) || []).filter(r => passes(r));

/* 앞선 선택에 맞춰 뒤쪽 목록을 좁힙니다 */
function buildFilters() {
  for (const f of FIELDS) {
    const el = $(f.id);
    const vals = [...new Set(rows.filter(r => passes(r, f.key)).map(r => r[f.key]).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, 'ko'));
    if (filters[f.key] && !vals.includes(filters[f.key])) vals.push(filters[f.key]);

    el.innerHTML = `<option value="">${f.label}</option>`
      + vals.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
    el.value = filters[f.key];

    $(f.wrap).dataset.on = filters[f.key] ? '1' : '0';
    $(f.wrap).hidden = vals.length === 0;       // 시트에 없는 열은 칩을 숨깁니다
  }
  $('reset').hidden = !FIELDS.some(f => filters[f.key]);
}

/* 같은 이름은 언제나 같은 형광펜 색 */
const colorOf = (() => {
  const cache = new Map();
  return name => {
    if (!name) return 'var(--rule)';
    if (!cache.has(name)) {
      let h = 0;
      for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      cache.set(name, `var(${PALETTE[h % PALETTE.length]})`);
    }
    return cache.get(name);
  };
})();

const colorKey = r => r[CONFIG.COLOR_BY] || r.branch || r.center;

/* ==================================================================
   6. 렌더
   ================================================================== */
function render() { renderMonth(); renderDay(); }

function renderMonth() {
  $('year').textContent = view.getFullYear();
  $('month').textContent = (view.getMonth() + 1) + '월';

  const first = startOfMonth(view);
  const start = new Date(first);
  start.setDate(1 - first.getDay());
  const todayKey = keyOf(new Date());
  const cells = [];

  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    if (i >= 35 && d.getMonth() !== view.getMonth()) break;

    const key = keyOf(d);
    const items = dayItems(key);
    const cls = ['cell'];
    if (d.getDay() === 0) cls.push('sun');
    if (d.getMonth() !== view.getMonth()) cls.push('dim');
    if (key === selected) cls.push('sel');
    if (key === todayKey) cls.push('today');

    const groups = [...new Set(items.map(colorKey))];
    const marks = groups.slice(0, 3).map(g => `<i class="mark" style="background:${colorOf(g)}"></i>`).join('');
    const more = groups.length > 3 ? `<i class="more">+${groups.length - 3}</i>` : '';

    cells.push(
      `<button class="${cls.join(' ')}" data-key="${key}" type="button"
               aria-label="${d.getMonth()+1}월 ${d.getDate()}일 강의 ${items.length}건"
               ${key === selected ? 'aria-current="date"' : ''}>
         <span class="swipe"></span>
         <span class="num">${d.getDate()}</span>
         <span class="marks">${marks}${more}</span>
       </button>`
    );
  }
  $('grid').innerHTML = cells.join('');
}

function renderDay() {
  const d = fromKey(selected);
  const items = dayItems(selected);
  const all = byDate.get(selected) || [];

  $('dayTitle').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}`;
  $('dayCount').textContent = items.length ? `강의 ${items.length}개` : '';

  if (!items.length) {
    $('list').innerHTML = all.length
      ? `<div class="empty">필터에 맞는 강의가 없습니다.
           <button type="button" onclick="clearFilters()">필터 초기화</button></div>`
      : `<div class="empty">이 날짜에 등록된 강의가 없습니다.</div>`;
    return;
  }

  $('list').innerHTML = items.map(r => {
    const tag  = colorKey(r);
    const head = r.title || r.branch || r.center || '강의';
    const sub  = [r.division, r.region, r.center, r.branch,
                  r.teacher ? r.teacher + ' 강사' : '', r.status, r.note]
      .filter(Boolean)
      .filter(x => x !== tag && x !== head)     // 큰 줄·태그와 겹치는 값은 뺍니다
      .join(' · ');

    return `<article class="item" style="--bar:${colorOf(tag)}">
      <div class="time">${esc(r.time || '—')}</div>
      <div class="meta">
        <div class="who">${esc(head)}</div>
        <div class="where">
          ${tag ? `<span class="tag">${esc(tag)}</span>` : ''}${esc(sub)}
        </div>
      </div>
    </article>`;
  }).join('');
}

function errorBox(err) {
  return `<div class="empty">
    시트를 불러오지 못했습니다.<br>
    시트 공유가 <b>링크가 있는 모든 사용자 · 뷰어</b>인지,
    <b>SHEET_ID</b>와 <b>SHEET_NAME</b>이 맞는지 확인해 주세요.
    <br><small style="opacity:.7">${esc(err.message || '')}</small>
    <button type="button" onclick="load()">다시 시도</button>
  </div>`;
}

function showBanner(html) { const el = $('banner'); el.innerHTML = html; el.hidden = !html; }
function setStatus(state, text) { $('status').dataset.live = state; $('statusText').textContent = text; }

function tickAgo() {
  if (!lastSync || $('status').dataset.live !== 'on') return;
  const s = Math.floor((Date.now() - lastSync) / 1000);
  $('statusText').textContent =
    s < 15 ? '방금 업데이트' : s < 60 ? `${s}초 전 업데이트` : `${Math.floor(s / 60)}분 전 업데이트`;
}

/* ==================================================================
   7. 이벤트
   ================================================================== */
$('grid').addEventListener('click', e => {
  const btn = e.target.closest('.cell');
  if (!btn) return;
  selected = btn.dataset.key;
  const d = fromKey(selected);
  if (d.getMonth() !== view.getMonth() || d.getFullYear() !== view.getFullYear()) view = startOfMonth(d);
  render();
});

$('prev').onclick = () => shiftMonth(-1);
$('next').onclick = () => shiftMonth(1);
$('todayBtn').onclick = () => { const t = new Date(); view = startOfMonth(t); selected = keyOf(t); render(); };

function shiftMonth(n) { view = new Date(view.getFullYear(), view.getMonth() + n, 1); render(); }

for (const f of FIELDS) {
  $(f.id).addEventListener('change', e => {
    filters[f.key] = e.target.value;
    buildFilters();
    render();
  });
}

function clearFilters() {
  for (const f of FIELDS) filters[f.key] = '';
  buildFilters();
  render();
}
$('reset').onclick = clearFilters;

// 좌우 스와이프로 달 이동
let sx = 0, sy = 0;
$('cal').addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive:true });
$('cal').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 55 && Math.abs(dy) < 45) shiftMonth(dx < 0 ? 1 : -1);
}, { passive:true });

/* ==================================================================
   8. 자동 새로고침 — 화면이 보일 때만
   ================================================================== */
function startPolling() { stopPolling(); timer = setInterval(() => load({ silent:true }), CONFIG.POLL_MS); }
function stopPolling() { if (timer) clearInterval(timer); timer = null; }

document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopPolling();
  else { load({ silent:true }); startPolling(); }
});
setInterval(tickAgo, 5000);

/* ==================================================================
   9. 유틸 · 샘플
   ================================================================== */
function pad(n){ return String(n).padStart(2,'0'); }
function keyOf(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function fromKey(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function sampleRows() {

  const raw = [
    [3,  900, '수도권교차','강북강남','서울교차','서울','장종우'],
    [3, 1400, '수도권교차','강서경기','광진송파교차','광진','신혜경'],

    [5, 1600, '지방교차','충청호남','광주교차','상무','백충현'],
    [8,  900, '수도권교차','강북강남','서울교차','서울','장종우'],
    [8, 1100, '수도권교차','강서경기','광진송파교차','광진','신혜경'],
    [8, 1500, '지방교차','부산대구','부산교차1','서면','김두기'],
    [8, 1830, '지방교차','충청호남','광주교차','상무','백충현'],
    [12,1000, '수도권교차','강북강남','서울교차','서울','신혜경'],
    [15, 900, '수도권교차','강서경기','광진송파교차','광진','장종우'],
    [16,1000, '지방교차','부산대구','부산교차1','서면','김두기'],
    [16,1600, '지방교차','충청호남','광주교차','상무','백충현'],

  return raw.map(([d, hhmm, division, region, branch, center, teacher]) => {
    const time = pad(Math.floor(hhmm / 100)) + ':' + pad(hhmm % 100);
    return { date: keyOf(new Date(y, m, d)), time, division, region, branch, center, teacher,
             title:'', status:'', note:'', sort: sortKey(time) };
  });
}

load().then(startPolling);
$('foot').textContent = CONFIG.MODE === 'csv' ? '웹게시 CSV · 반영까지 수 분 소요' : '구글시트 실시간 연동';
</script>
